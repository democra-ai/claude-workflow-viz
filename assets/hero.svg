<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="claude-workflow-viz — visualize Claude Code dynamic workflows">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1117"/>
      <stop offset="1" stop-color="#070a0e"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="440" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1279" height="439" fill="none" stroke="#1f2a36"/>

  <!-- subtle grid -->
  <g stroke="#121a23" stroke-width="1">
    <line x1="0" y1="110" x2="1280" y2="110"/>
    <line x1="0" y1="330" x2="1280" y2="330"/>
  </g>

  <!-- wordmark -->
  <text x="64" y="92" fill="#e7edf3" font-size="40" font-weight="700" letter-spacing="0.5">claude-workflow-viz</text>
  <text x="66" y="128" fill="#7c8895" font-size="17">Visualize Claude Code dynamic workflows — DAG · gantt · live concurrency · interactive report</text>

  <!-- pipeline diagram: prompt -> script -> fan-out(5) -> barrier -> reduce -> result -->
  <g transform="translate(64,196)">
    <!-- prompt -->
    <rect x="0" y="36" width="92" height="40" rx="8" fill="#0f151c" stroke="#1f2a36"/>
    <text x="46" y="61" fill="#7c8895" font-size="13" text-anchor="middle">prompt</text>

    <!-- script -->
    <rect x="128" y="36" width="104" height="40" rx="8" fill="#0f151c" stroke="#2dd4bf"/>
    <text x="180" y="61" fill="#2dd4bf" font-size="13" text-anchor="middle">script.js</text>

    <!-- connectors prompt->script -->
    <line x1="92" y1="56" x2="128" y2="56" stroke="#2b3a49" stroke-width="2"/>

    <!-- fan-out edges script -> 5 agents -->
    <g stroke="#2b3a49" stroke-width="2" fill="none">
      <path d="M232 56 C 300 56, 300 16, 372 16"/>
      <path d="M232 56 C 300 56, 300 46, 372 46"/>
      <path d="M232 56 C 300 56, 300 76, 372 76"/>
      <path d="M232 56 C 300 56, 300 106, 372 106"/>
      <path d="M232 56 C 300 56, 300 136, 372 136"/>
    </g>

    <!-- 5 parallel agents (lane colors match the app) -->
    <g>
      <rect x="372" y="2"   width="150" height="26" rx="6" fill="#15212e" stroke="#5aa9ff"/>
      <rect x="372" y="2"   width="150" height="26" rx="6" fill="#5aa9ff" opacity="0.16"/>
      <text x="384" y="20" fill="#9fc6ff" font-size="12">search:official-docs</text>

      <rect x="372" y="33"  width="120" height="26" rx="6" fill="#15212e" stroke="#f5b454"/>
      <rect x="372" y="33"  width="120" height="26" rx="6" fill="#f5b454" opacity="0.16"/>
      <text x="384" y="51" fill="#f5cd86" font-size="12">search:release</text>

      <rect x="372" y="64"  width="150" height="26" rx="6" fill="#15212e" stroke="#34d399"/>
      <rect x="372" y="64"  width="150" height="26" rx="6" fill="#34d399" opacity="0.16"/>
      <text x="384" y="82" fill="#83e6bf" font-size="12">search:how-it-works</text>

      <rect x="372" y="95"  width="138" height="26" rx="6" fill="#15212e" stroke="#c084fc"/>
      <rect x="372" y="95"  width="138" height="26" rx="6" fill="#c084fc" opacity="0.16"/>
      <text x="384" y="113" fill="#d4adff" font-size="12">search:community</text>

      <rect x="372" y="126" width="132" height="26" rx="6" fill="#15212e" stroke="#fb7185"/>
      <rect x="372" y="126" width="132" height="26" rx="6" fill="#fb7185" opacity="0.16"/>
      <text x="384" y="144" fill="#ffa7b3" font-size="12">search:compare</text>
    </g>

    <!-- edges agents -> barrier -->
    <g stroke="#2b3a49" stroke-width="2" fill="none">
      <path d="M522 15 C 580 15, 580 56, 632 56"/>
      <path d="M492 46 C 580 46, 580 56, 632 56"/>
      <path d="M522 77 C 580 77, 580 56, 632 56"/>
      <path d="M510 108 C 580 108, 580 56, 632 56"/>
      <path d="M504 139 C 580 139, 580 56, 632 56"/>
    </g>

    <!-- barrier -->
    <g>
      <line x1="632" y1="6" x2="632" y2="106" stroke="#f5b454" stroke-width="2" stroke-dasharray="5 4"/>
      <text x="640" y="120" fill="#f5b454" font-size="12">barrier · parallel() waits for all</text>
    </g>

    <!-- reduce -->
    <line x1="632" y1="56" x2="690" y2="56" stroke="#2b3a49" stroke-width="2"/>
    <rect x="690" y="36" width="120" height="40" rx="8" fill="#0f151c" stroke="#5aa9ff"/>
    <text x="750" y="61" fill="#9fc6ff" font-size="13" text-anchor="middle">synthesize</text>

    <!-- result -->
    <line x1="810" y1="56" x2="866" y2="56" stroke="#2b3a49" stroke-width="2"/>
    <g filter="url(#glow)">
      <rect x="866" y="34" width="118" height="44" rx="9" fill="#0b2b27" stroke="url(#teal)" stroke-width="1.5"/>
    </g>
    <text x="925" y="61" fill="#5eead4" font-size="13" text-anchor="middle" font-weight="700">return ✓</text>

    <!-- concurrency mini-curve -->
    <g transform="translate(1024,8)">
      <text x="0" y="6" fill="#525e6b" font-size="11">concurrency</text>
      <path d="M0 78 L0 40 L24 40 L24 26 L60 26 L60 40 L84 40 L84 78 Z" fill="#2dd4bf" opacity="0.14"/>
      <path d="M0 40 L24 40 L24 26 L60 26 L60 40 L84 40" fill="none" stroke="#2dd4bf" stroke-width="1.6" opacity="0.6"/>
      <text x="0" y="96" fill="#7c8895" font-size="12">peak ×5 / 16</text>
    </g>
  </g>

  <!-- footer stats line -->
  <g transform="translate(64,388)">
    <text x="0" y="16" fill="#525e6b" font-size="13">npx github:democra-ai/claude-workflow-viz</text>
    <text x="1152" y="16" fill="#525e6b" font-size="13" text-anchor="end">zero runtime deps · MIT</text>
  </g>
</svg>
